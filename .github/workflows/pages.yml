name: Deploy Ops Dashboard

on:
  push:
    branches: [main]
    paths: ['ops_dashboard/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops_dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Build for the GitHub Pages subpath. The Supabase anon/url are public and
      # inlined here; quick-admin creds are intentionally NOT set so the admin
      # password never ships in the public bundle (email/password auth still guards it).
      - run: npm run build -- --base=/court_plus/
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ops_dashboard/dist
      - id: deployment
        uses: actions/deploy-pages@v4
